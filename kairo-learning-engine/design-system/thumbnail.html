<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:854px;overflow:hidden;font-family:var(--font-body)}
.wrap{width:1280px;height:854px;display:flex}
.main{flex:1;background:var(--kairo-navy-900);display:flex;align-items:center;justify-content:center}
.main img{height:220px;width:auto}
.strip{width:190px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}
</style></head>
<body>
<div class="wrap">
<div class="main"><img src="assets/kairo-mark-white.png" alt="Kairo"></div>
<div class="strip">
<div style="background:var(--kairo-gold-500)"></div>
<div style="background:var(--kairo-blue-500)"></div>
<div style="background:var(--kairo-success-600)"></div>
<div style="background:var(--kairo-blue-700)"></div>
</div>
</div>
</body></html>
