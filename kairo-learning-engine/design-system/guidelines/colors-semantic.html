<!-- @dsCard group="Colors" viewport="700x130" name="Semantic Feedback" subtitle="Correct / incorrect / caution — always paired with icon + label" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:130px;font-family:var(--font-body);padding:8px;background:var(--color-bg-canvas)">
<div style="flex:1;background:var(--state-success-bg);border-left:4px solid var(--state-success);border-radius:8px;padding:12px;color:var(--kairo-navy-900);font-size:13px">✓ Correct<br><span style="color:var(--state-success);font-weight:600">#1E8A5F</span></div>
<div style="flex:1;background:var(--state-danger-bg);border-left:4px solid var(--state-danger);border-radius:8px;padding:12px;color:var(--kairo-navy-900);font-size:13px">✕ Incorrect<br><span style="color:var(--state-danger);font-weight:600">#C24242</span></div>
<div style="flex:1;background:var(--state-caution-bg);border-left:4px solid var(--state-caution);border-radius:8px;padding:12px;color:var(--kairo-navy-900);font-size:13px">Caution<br><span style="color:var(--state-caution);font-weight:600">#B9812F</span></div>
</div>
