<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--color-bg-canvas);font-family:var(--font-body)"></div>
<script type="text/babel">
const { Button, IconButton, Input, Checkbox, Radio, Switch, Badge } = window.KairoDesignSystem_1c2e7f;
function Demo(){
  const [checked, setChecked] = React.useState(true);
  const [radio, setRadio] = React.useState('smart');
  const [sw, setSw] = React.useState(false);
  return (
    <div style={{display:'flex', flexDirection:'column', gap:20}}>
      <div style={{display:'flex', gap:12, flexWrap:'wrap', alignItems:'center'}}>
        <Button variant="primary">Start Mission</Button>
        <Button variant="secondary">Skip</Button>
        <Button variant="ghost">See details</Button>
        <Button variant="gold">Share result</Button>
        <Button disabled>Submit Answer</Button>
      </div>
      <div style={{display:'flex', gap:12, alignItems:'center'}}>
        <IconButton active><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg></IconButton>
        <IconButton variant="filled"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2"><path d="M4 21v-7M4 10V3M12 21v-11M12 6V3M20 21v-5M20 12V3"/></svg></IconButton>
        <Badge tone="navy">12 day streak</Badge>
        <Badge tone="gold">Reinforced</Badge>
        <Badge tone="success">78% accuracy</Badge>
      </div>
      <div style={{maxWidth:320}}>
        <Input label="Email Address" placeholder="Enter your email" />
      </div>
      <div style={{display:'flex', gap:20, alignItems:'center'}}>
        <Checkbox checked={checked} onChange={()=>setChecked(!checked)} label="Academic Nudges" />
        <Radio checked={radio==='smart'} onChange={()=>setRadio('smart')} label="Smart Practice" />
        <Radio checked={radio==='manual'} onChange={()=>setRadio('manual')} label="Manual Practice" />
        <Switch checked={sw} onChange={()=>setSw(!sw)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
